# ════════════════════════════════════════════════════════════════════════════
# 🔍  CI — Continuous Integration
#
# Runs on every push to any branch and on every Pull Request targeting
# `main` or `develop`.  Three parallel tracks:
#   1. Backend  — syntax validation + security audit
#   2. Frontend — production build + bundle report + security audit
#   3. Quality Gate — blocks merge if any track fails
# ════════════════════════════════════════════════════════════════════════════

name: 🔍 CI — Continuous Integration

on:
  push:
    branches: ['**']               # every branch
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, ready_for_review]

# Cancel in-progress runs on the same ref so pushes don't queue up
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20.x'

# ─────────────────────────────────────────────────────────────────────────────
jobs:

  # ╔══════════════════════════════════╗
  # ║   TRACK 1 · BACKEND             ║
  # ╚══════════════════════════════════╝

  backend-validate:
    name: 🟢 Backend › Syntax Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v6

      - name: ⚙️ Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: 📦 Install dependencies (clean)
        run: npm ci

      - name: 🔎 Validate JS syntax (all source files)
        run: npm run validate

      - name: ✅ Syntax check passed
        run: |
          echo "### 🟢 Backend Syntax" >> $GITHUB_STEP_SUMMARY
          echo "All source files passed Node.js syntax check." >> $GITHUB_STEP_SUMMARY


  backend-audit:
    name: 🟢 Backend › Security Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔐 Run npm audit (high + critical)
        run: |
          npm audit --audit-level=high --json > audit-report.json || true
          CRITICAL=$(cat audit-report.json | node -e "
            const d=JSON.parse(require('fs').readFileSync('/dev/stdin','utf8'));
            const v=d.vulnerabilities||{};
            const c=Object.values(v).filter(x=>x.severity==='critical').length;
            console.log(c);
          " 2>/dev/null || echo "0")
          HIGH=$(cat audit-report.json | node -e "
            const d=JSON.parse(require('fs').readFileSync('/dev/stdin','utf8'));
            const v=d.vulnerabilities||{};
            const h=Object.values(v).filter(x=>x.severity==='high').length;
            console.log(h);
          " 2>/dev/null || echo "0")
          echo "### 🔐 Backend Security Audit" >> $GITHUB_STEP_SUMMARY
          echo "| Severity | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🔴 Critical | $CRITICAL |" >> $GITHUB_STEP_SUMMARY
          echo "| 🟠 High | $HIGH |" >> $GITHUB_STEP_SUMMARY
          if [ "$CRITICAL" -gt "0" ]; then
            echo "❌ Critical vulnerabilities found! Run: npm audit fix"
            exit 1
          fi

      - name: 📤 Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-audit-report
          path: backend/audit-report.json
          retention-days: 14


  backend-test:
    name: 🟢 Backend › Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🧪 Run tests
        run: npm test
        env:
          NODE_ENV: test

      - name: 📋 Test summary
        if: always()
        run: |
          echo "### 🧪 Backend Tests" >> $GITHUB_STEP_SUMMARY
          echo "Test run completed. Add Jest/Mocha tests to \`backend/tests/\` for coverage." >> $GITHUB_STEP_SUMMARY


  # ╔══════════════════════════════════╗
  # ║   TRACK 2 · FRONTEND            ║
  # ╚══════════════════════════════════╝

  frontend-build:
    name: ⚛️ Frontend › Production Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v6

      - name: ⚙️ Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Install dependencies (clean)
        run: npm ci

      - name: 🏗️ Build production bundle
        run: npm run build
        env:
          # Inject the production API URL at build time
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL || 'http://localhost:5000' }}

      - name: 📊 Report bundle sizes
        run: |
          echo "### ⚛️ Frontend Bundle Report" >> $GITHUB_STEP_SUMMARY
          echo "| File | Raw Size | Gzip Size |" >> $GITHUB_STEP_SUMMARY
          echo "|------|----------|-----------|" >> $GITHUB_STEP_SUMMARY
          for f in dist/assets/*.js dist/assets/*.css; do
            [ -f "$f" ] || continue
            RAW=$(du -h "$f" | cut -f1)
            GZIP=$(gzip -c "$f" | wc -c | awk '{printf "%.1f kB", $1/1024}')
            echo "| \`$(basename $f)\` | $RAW | $GZIP |" >> $GITHUB_STEP_SUMMARY
          done
          TOTAL_JS=$(find dist/assets -name '*.js' -exec du -bc {} + | tail -1 | cut -f1)
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> Total JS: $(( TOTAL_JS / 1024 )) kB" >> $GITHUB_STEP_SUMMARY

      - name: 📤 Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-${{ github.sha }}
          path: frontend/dist/
          retention-days: 7
          if-no-files-found: error


  frontend-audit:
    name: ⚛️ Frontend › Security Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔐 Run npm audit (high + critical)
        run: npm audit --audit-level=high
        continue-on-error: true   # warn but don't block on transitive UI deps

      - name: 📤 Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-audit-report
          path: frontend/npm-audit.json
          retention-days: 14
        continue-on-error: true


  frontend-test:
    name: ⚛️ Frontend › Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🧪 Run tests
        run: npm test
        env:
          NODE_ENV: test

      - name: 📋 Test summary
        if: always()
        run: |
          echo "### 🧪 Frontend Tests" >> $GITHUB_STEP_SUMMARY
          echo "Add Vitest tests to \`frontend/src/__tests__/\` for component coverage." >> $GITHUB_STEP_SUMMARY


  # ╔══════════════════════════════════╗
  # ║   QUALITY GATE                  ║
  # ╚══════════════════════════════════╝

  ci-gate:
    name: ✅ CI Quality Gate
    runs-on: ubuntu-latest
    needs:
      - backend-validate
      - backend-audit
      - backend-test
      - frontend-build
      - frontend-audit
      - frontend-test
    if: always()

    steps:
      - name: 📋 Evaluate results
        run: |
          echo "## CI Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🟢 Backend Validate   | ${{ needs.backend-validate.result }}  |" >> $GITHUB_STEP_SUMMARY
          echo "| 🟢 Backend Audit      | ${{ needs.backend-audit.result }}     |" >> $GITHUB_STEP_SUMMARY
          echo "| 🟢 Backend Tests      | ${{ needs.backend-test.result }}      |" >> $GITHUB_STEP_SUMMARY
          echo "| ⚛️ Frontend Build     | ${{ needs.frontend-build.result }}    |" >> $GITHUB_STEP_SUMMARY
          echo "| ⚛️ Frontend Audit     | ${{ needs.frontend-audit.result }}    |" >> $GITHUB_STEP_SUMMARY
          echo "| ⚛️ Frontend Tests     | ${{ needs.frontend-test.result }}     |" >> $GITHUB_STEP_SUMMARY

      - name: ❌ Fail if required checks failed
        if: |
          needs.backend-validate.result  == 'failure' ||
          needs.backend-audit.result     == 'failure' ||
          needs.backend-test.result      == 'failure' ||
          needs.frontend-build.result    == 'failure' ||
          needs.frontend-test.result     == 'failure'
        run: |
          echo "One or more required CI checks failed. Please fix the issues above."
          exit 1

      - name: ✅ All checks passed
        if: |
          needs.backend-validate.result  == 'success' &&
          needs.backend-audit.result     == 'success' &&
          needs.backend-test.result      == 'success' &&
          needs.frontend-build.result    == 'success' &&
          needs.frontend-test.result     == 'success'
        run: |
          echo "🚀 All CI checks passed! This commit is ready to deploy." >> $GITHUB_STEP_SUMMARY
