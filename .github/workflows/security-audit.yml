# ════════════════════════════════════════════════════════════════════════════
# 🔐  Security Audit — Scheduled + On-Demand
#
# Runs:
#   • Every Monday at 08:00 UTC (weekly scheduled scan)
#   • On every PR targeting main or develop (gating security regressions)
#   • Manually via workflow_dispatch
#
# Checks:
#   1. npm audit (backend + frontend — separate reports)
#   2. Sensitive file / secret pattern detection
#   3. Outdated dependency report
#   4. License compatibility check
# ════════════════════════════════════════════════════════════════════════════

name: 🔐 Security — Weekly Audit

on:
  schedule:
    - cron: '0 8 * * 1'      # Every Monday at 08:00 UTC
  pull_request:
    branches: [main, develop]
  workflow_dispatch:          # Allow manual trigger from Actions tab

env:
  NODE_VERSION: '20.x'

# ─────────────────────────────────────────────────────────────────────────────
jobs:

  # ╔══════════════════════════════════╗
  # ║   DEPENDENCY AUDIT              ║
  # ╚══════════════════════════════════╝

  audit-backend:
    name: 🟢 Backend › Dependency Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: 📦 Install
        run: npm ci

      - name: 🔐 Full audit with JSON output
        id: audit
        run: |
          npm audit --json > audit.json 2>&1 || true
          CRITICAL=$(node -e "
            const d=JSON.parse(require('fs').readFileSync('audit.json','utf8'));
            const v=d.vulnerabilities||{};
            console.log(Object.values(v).filter(x=>x.severity==='critical').length);
          " 2>/dev/null || echo "0")
          HIGH=$(node -e "
            const d=JSON.parse(require('fs').readFileSync('audit.json','utf8'));
            const v=d.vulnerabilities||{};
            console.log(Object.values(v).filter(x=>x.severity==='high').length);
          " 2>/dev/null || echo "0")
          MOD=$(node -e "
            const d=JSON.parse(require('fs').readFileSync('audit.json','utf8'));
            const v=d.vulnerabilities||{};
            console.log(Object.values(v).filter(x=>x.severity==='moderate').length);
          " 2>/dev/null || echo "0")
          echo "critical=$CRITICAL" >> $GITHUB_OUTPUT
          echo "high=$HIGH"         >> $GITHUB_OUTPUT
          echo "moderate=$MOD"      >> $GITHUB_OUTPUT
          echo "### 🔐 Backend Audit Results" >> $GITHUB_STEP_SUMMARY
          echo "| Severity | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🔴 Critical | $CRITICAL |" >> $GITHUB_STEP_SUMMARY
          echo "| 🟠 High     | $HIGH     |" >> $GITHUB_STEP_SUMMARY
          echo "| 🟡 Moderate | $MOD      |" >> $GITHUB_STEP_SUMMARY

      - name: ❌ Fail on critical vulnerabilities
        if: ${{ steps.audit.outputs.critical != '0' }}
        run: |
          echo "Critical vulnerabilities detected in backend dependencies!"
          echo "Run: cd backend && npm audit fix"
          exit 1

      - name: 📤 Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-security-audit-${{ github.run_number }}
          path: backend/audit.json
          retention-days: 30


  audit-frontend:
    name: ⚛️ Frontend › Dependency Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Install
        run: npm ci

      - name: 🔐 Full audit with JSON output
        id: audit
        run: |
          npm audit --json > audit.json 2>&1 || true
          CRITICAL=$(node -e "
            const d=JSON.parse(require('fs').readFileSync('audit.json','utf8'));
            const v=d.vulnerabilities||{};
            console.log(Object.values(v).filter(x=>x.severity==='critical').length);
          " 2>/dev/null || echo "0")
          HIGH=$(node -e "
            const d=JSON.parse(require('fs').readFileSync('audit.json','utf8'));
            const v=d.vulnerabilities||{};
            console.log(Object.values(v).filter(x=>x.severity==='high').length);
          " 2>/dev/null || echo "0")
          echo "critical=$CRITICAL" >> $GITHUB_OUTPUT
          echo "high=$HIGH"         >> $GITHUB_OUTPUT
          echo "### 🔐 Frontend Audit Results" >> $GITHUB_STEP_SUMMARY
          echo "| Severity | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🔴 Critical | $CRITICAL |" >> $GITHUB_STEP_SUMMARY
          echo "| 🟠 High     | $HIGH     |" >> $GITHUB_STEP_SUMMARY

      - name: ❌ Fail on critical (frontend)
        if: ${{ steps.audit.outputs.critical != '0' }}
        run: |
          echo "Critical vulnerabilities in frontend dependencies! Run: cd frontend && npm audit fix"
          exit 1

      - name: 📤 Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-security-audit-${{ github.run_number }}
          path: frontend/audit.json
          retention-days: 30


  # ╔══════════════════════════════════╗
  # ║   SECRET / SENSITIVE FILE SCAN  ║
  # ╚══════════════════════════════════╝

  secret-scan:
    name: 🕵️ Secret & Sensitive File Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0    # Full history for commit-level scanning

      - name: 🔍 Scan for .env files accidentally committed
        run: |
          echo "### 🕵️ Secret File Scan" >> $GITHUB_STEP_SUMMARY
          FOUND=0

          # Check for .env files (not .env.example)
          ENV_FILES=$(git ls-files | grep -E '^.+\.env$' | grep -v '.env.example' || true)
          if [ -n "$ENV_FILES" ]; then
            echo "❌ .env files found in repository:" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "$ENV_FILES" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            FOUND=1
          fi

          # Check for private key patterns
          git ls-files | xargs grep -rl \
            -e "-----BEGIN RSA PRIVATE KEY-----" \
            -e "-----BEGIN EC PRIVATE KEY-----" \
            -e "-----BEGIN OPENSSH PRIVATE KEY-----" \
            2>/dev/null | grep -v node_modules | while read f; do
            echo "❌ Private key found in: $f" >> $GITHUB_STEP_SUMMARY
            FOUND=1
          done || true

          # Check for hardcoded MongoDB URIs
          MONGO_HITS=$(git ls-files | xargs grep -rl "mongodb+srv://" 2>/dev/null \
            | grep -v node_modules | grep -v '.env.example' | grep -v '.md' || true)
          if [ -n "$MONGO_HITS" ]; then
            echo "⚠️ MongoDB URI patterns found in:" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "$MONGO_HITS" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

          if [ "$FOUND" -eq "1" ]; then
            exit 1
          fi
          echo "✅ No secrets or sensitive files detected." >> $GITHUB_STEP_SUMMARY


  # ╔══════════════════════════════════╗
  # ║   OUTDATED DEPS REPORT          ║
  # ╚══════════════════════════════════╝

  outdated-report:
    name: 📦 Outdated Dependency Report
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 📦 Backend outdated packages
        working-directory: ./backend
        run: |
          npm install --prefer-offline 2>/dev/null || true
          echo "### 📦 Backend Outdated Packages" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          npm outdated 2>/dev/null >> $GITHUB_STEP_SUMMARY || echo "All packages up to date" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
        continue-on-error: true

      - name: 📦 Frontend outdated packages
        working-directory: ./frontend
        run: |
          npm install --prefer-offline 2>/dev/null || true
          echo "### 📦 Frontend Outdated Packages" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          npm outdated 2>/dev/null >> $GITHUB_STEP_SUMMARY || echo "All packages up to date" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
        continue-on-error: true


  # ╔══════════════════════════════════╗
  # ║   SECURITY SUMMARY              ║
  # ╚══════════════════════════════════╝

  security-gate:
    name: 🔐 Security Gate
    runs-on: ubuntu-latest
    needs: [audit-backend, audit-frontend, secret-scan]
    if: always()

    steps:
      - name: 📋 Security summary
        run: |
          echo "## 🔐 Security Audit Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Backend Audit  | ${{ needs.audit-backend.result }}  |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend Audit | ${{ needs.audit-frontend.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Secret Scan    | ${{ needs.secret-scan.result }}    |" >> $GITHUB_STEP_SUMMARY

      - name: ❌ Fail if security issues found
        if: |
          needs.audit-backend.result  == 'failure' ||
          needs.audit-frontend.result == 'failure' ||
          needs.secret-scan.result    == 'failure'
        run: |
          echo "Security checks failed. Address vulnerabilities before merging."
          exit 1
